version: '3'
services:
  app_test_login:
    container_name: external-login-test
    restart: always
    image: mcr.microsoft.com/dotnet/aspnet:9.0
    build:
      context: ./app
      dockerfile: Dockerfile
    expose:
      - '8080'
    ports:
      - '8184:8080'
    volumes:
      - ./app/publish:/app
    command: ["dotnet", "app/RazorPage individualaccounts.dll"]
    environment:
      - ConnectionStrings:DefaultConnection=Server=(localdb)\\mssqllocaldb;Database=aspnet-RazorPage_individualaccounts-02c52d50-dfec-4d84-a497-9ebc0ed67f54;Trusted_Connection=True;MultipleActiveResultSets=true